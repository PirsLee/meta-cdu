# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cdu"
BBFILE_PATTERN_meta-cdu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cdu = "6"

LAYERDEPENDS_meta-cdu = "core"
LAYERSERIES_COMPAT_meta-cdu = "wrynose"
